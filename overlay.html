<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Субтитры Саши</title>
<style>
  :root { --font-size: 44px; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  body {
    font-family: "Segoe UI", "Arial", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Подсказка, если страница открыта без настроек и без адреса OBS. */
  #hint {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    width: min(92vw, 960px);
    padding: 24px 28px;
    font-size: 26px;
    line-height: 1.4;
    text-align: center;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.72);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 14px;
    text-shadow: 0 0 6px #000000, 0 2px 4px #000000;
  }

  #hint[hidden] { display: none; }

  /* Сцена субтитров: плавно появляется и гаснет через CSS-переход. */
  #stage {
    position: fixed;
    left: 50%;
    bottom: 7vh;
    transform: translateX(-50%);
    width: max-content;
    max-width: 92vw;
    text-align: center;
    opacity: 0;
    transition: opacity 0.35s ease;
    will-change: opacity;
  }

  #stage.show { opacity: 1; }

  /* Промежуточный текст (final:false) бледнее готовой фразы. */
  #stage.interim #speaker,
  #stage.interim #line { opacity: 0.62; }

  #speaker {
    display: inline-block;
    margin-bottom: 0.2em;
    font-size: calc(var(--font-size) * 0.48);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.02em;
    color: #ffffff;
    /* Чёрная обводка: имя видно и на белом, и на чёрном фоне. */
    text-shadow:
      0 0 6px rgba(0, 0, 0, 0.95),
      0 0 16px rgba(0, 0, 0, 0.85),
      0 2px 4px rgba(0, 0, 0, 0.95),
      0 0 2px #000000;
  }

  #line {
    margin: 0;
    font-size: var(--font-size);
    font-weight: 700;
    line-height: 1.22;
    color: #ffffff;
    white-space: pre-line;
    overflow-wrap: break-word;
    /* Чёрная обводка: видно на белом и на чёрном фоне. */
    text-shadow:
      0 0 6px rgba(0, 0, 0, 0.95),
      0 0 16px rgba(0, 0, 0, 0.85),
      0 2px 4px rgba(0, 0, 0, 0.95),
      0 0 2px #000000;
  }
</style>
</head>
<body>
<div id="hint" hidden></div>
<div id="stage">
  <div id="speaker"></div>
  <div id="line"></div>
</div>
<script src="js/text.js"></script>
<script src="js/obs.js"></script>
<script src="js/overlay.js"></script>
<script>
  (function () {
    "use strict";
    // server.py подставляет сюда config.json вместо заглушки настроек.
    // При открытии файла без сервера имени нет — это не ошибка, а режим
    // настройки: ловим ReferenceError и показываем подсказку.
    var config = null;
    try {
      config = __CONFIG_JSON__;
    } catch (error) {
      config = null;
    }
    window.__SASHA_CONFIG__ = config;
    var parsed = SS.Overlay.parseLocation(window.location, config);
    var overlay = SS.Overlay.createOverlay(document, window, {
      mode: parsed.mode,
      wsUrl: parsed.wsUrl,
      password: parsed.password,
      config: parsed.config
    });
    window.__SASHA_OVERLAY__ = overlay;
    overlay.start();
  })();
</script>
</body>
</html>
